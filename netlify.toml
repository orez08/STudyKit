[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Forward all API calls to the Netlify Serverless Function handler
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA client-side routing fallback - MUST be placed AFTER /api/* rules
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
